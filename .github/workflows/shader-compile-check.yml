name: Shader and State Contract Check

# Two scopes, one workflow. Pushes and pull requests run the "fast" legs: one editor per pipeline
# family, Linear only, D3D + Vulkan only — the trim is measured, not guessed (a full URP leg spends
# ~87% of its wall clock on one 256-variant pass, and Gamma doubles everything). The nightly run and
# a manual dispatch carry the full sweep: every editor, both color spaces, every compiler platform.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (every editor, both color spaces, every compiler platform)"
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: ["**"]
    paths:
      - "Packages/media.lightside.core"
      - "Packages/media.lightside.unilottie"
      - "Packages/media.lightside.unishapes"
      - "Packages/media.lightside.unitext"
      - ".github/ci/shader-compile/**"
      - ".github/workflows/shader-compile-check.yml"
  pull_request:
    paths:
      - "Packages/media.lightside.core"
      - "Packages/media.lightside.unilottie"
      - "Packages/media.lightside.unishapes"
      - "Packages/media.lightside.unitext"
      - ".github/ci/shader-compile/**"
      - ".github/workflows/shader-compile-check.yml"

permissions:
  contents: read
  checks: write

concurrency:
  group: shader-compile-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out the matrix definitions
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/ci/shader-compile

      - name: Select the matrix for this trigger
        id: select
        shell: bash
        env:
          FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            SCOPE=full
          else
            SCOPE=fast
          fi
          echo "Matrix scope: $SCOPE"
          {
            echo "matrix<<MATRIX_JSON"
            cat ".github/ci/shader-compile/matrix-$SCOPE.json"
            echo "MATRIX_JSON"
          } >> "$GITHUB_OUTPUT"

  compile:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    # The only timeout in the system: the compile test carries none, because how long a sweep may take
    # is a property of the platforms and color spaces it was handed. A cold fast leg spends ~90 min in
    # one 256-variant forward pass, and a full leg is one color space precisely so it stays under
    # GitHub's own 6-hour job ceiling.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout project and packages
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          lfs: true
          submodules: recursive

      - name: Setup .NET for LightSide state code generation
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build LightSide state source generator
        shell: bash
        run: |
          dotnet build Packages/media.lightside.core/Tools~/StateCodeGen/LightSide.StateCodeGen.csproj --configuration Release
          test -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.dll
          test ! -f Packages/media.lightside.core/Analyzers/LightSide.StateCodeGen.deps.json

      # Only the fast legs are cached. They are the ones latency matters for, and twelve nightly
      # Libraries would evict them from the repository's 10 GB of cache within a single run.
      - name: Restore Unity Library
        id: unity-library
        if: matrix.scope == 'fast'
        uses: actions/cache/restore@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library
          key: shader-library-${{ matrix.project }}-${{ matrix.scope }}-${{ hashFiles('.github/ci/shader-compile/**', 'Packages/media.lightside.core/**', 'Packages/media.lightside.unitext/**', 'Packages/media.lightside.unishapes/**', 'Packages/media.lightside.unilottie/**') }}
          restore-keys: |
            shader-library-${{ matrix.project }}-${{ matrix.scope }}-

      - name: Run shader and serialized-state contract tests
        id: shader-tests
        uses: game-ci/unity-test-runner@08fd329f00a18efa297140b14ac28ebce742759e
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .github/ci/shader-compile/projects/${{ matrix.project }}
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          artifactsPath: artifacts/${{ matrix.project }}
          customParameters: -expectedRenderPipeline ${{ matrix.pipeline }} -shaderColorSpaces ${{ matrix.colorSpaces }} -shaderPlatforms ${{ matrix.platforms }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Shader and State Contracts (${{ matrix.scope }}) - ${{ matrix.name }}

      # The shader cache is the whole reason a warm run takes minutes instead of an hour, and a red
      # run warms it just as well as a green one — actions/cache's own post step saves only on success.
      - name: Save Unity Library
        if: always() && matrix.scope == 'fast' && steps.unity-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .github/ci/shader-compile/projects/${{ matrix.project }}/Library
          key: shader-library-${{ matrix.project }}-${{ matrix.scope }}-${{ hashFiles('.github/ci/shader-compile/**', 'Packages/media.lightside.core/**', 'Packages/media.lightside.unitext/**', 'Packages/media.lightside.unishapes/**', 'Packages/media.lightside.unilottie/**') }}

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ShaderDiagnostics-${{ matrix.project }}-${{ matrix.scope }}-${{ matrix.colorSpaces }}
          path: artifacts/${{ matrix.project }}
          if-no-files-found: warn
          retention-days: 14
